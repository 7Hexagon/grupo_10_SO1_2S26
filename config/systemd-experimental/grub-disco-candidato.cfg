# Candidato local: todavia no instalado ni probado en disco.
set default=0
set timeout=10
insmod part_msdos
insmod ext2
insmod search_fs_uuid

menuentry 'Aegis Auth - systemd' {
    search --no-floppy --fs-uuid --set=root 73dc87ee-e227-4f48-939f-67f81f6556d3
    linux /boot/vmlinuz-7.1.8-lfs-13.1-systemd root=PARTUUID=3c533006-01 rootfstype=ext4 rw rootwait init=/usr/lib/systemd/systemd console=tty0
}

menuentry 'Aegis Auth - recuperacion aegis-init' {
    search --no-floppy --fs-uuid --set=root 73dc87ee-e227-4f48-939f-67f81f6556d3
    linux /boot/vmlinuz-7.1.8-lfs-13.1-systemd root=PARTUUID=3c533006-01 rootfstype=ext4 rw rootwait init=/usr/sbin/aegis-init console=tty0
}
